<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #ffffff;
            line-height: 1.6; min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* =========================
           NAVBAR
        ========================== */
        .navbar {
            width: 100%; position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(77, 163, 255, 0.12);
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 76px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            box-shadow: 0 8px 25px rgba(77, 163, 255, 0.25);
            font-size: 21px;
        }
        .logo span { color: #4da3ff; }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .balance-pill {
            padding: 8px 14px; border-radius: 10px;
            background: rgba(77, 163, 255, 0.08);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: #76baff; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
        }
        .balance-pill span { color: #ffffff; }

        .addfunds-pill {
            padding: 8px 14px; border-radius: 10px;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: #ffffff; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 8px 20px rgba(40, 104, 255, 0.25);
            transition: 0.2s;
            white-space: nowrap;
        }
        .addfunds-pill:hover { transform: translateY(-1px); }

        .menu-btn {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 28px; height: 20px; background: transparent;
            border: none; padding: 0;
        }
        .menu-btn .bar {
            width: 100%; height: 3px; border-radius: 2px;
            background: #ffffff; transition: 0.3s;
        }
        .menu-btn:hover .bar { background: #62adff; }

        /* =========================
           SLIDE-OUT MENU
        ========================== */
        .menu-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            opacity: 0; pointer-events: none;
            transition: 0.3s; z-index: 1500;
        }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }

        .side-menu {
            position: fixed; top: 0; right: -100%;
            width: 300px; height: 100vh;
            background: #ffffff; color: #000000;
            z-index: 1600; transition: right 0.35s ease;
            display: flex; flex-direction: column;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }
        .side-menu.active { right: 0; }

        .side-menu-header {
            padding: 22px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #eee;
        }
        .side-menu-header .brand {
            font-size: 17px; font-weight: 800; color: #000;
            display: flex; align-items: center; gap: 8px;
        }
        .side-menu-header .brand span { color: #2868ff; }
        .close-menu {
            background: transparent; border: none;
            font-size: 24px; color: #555; line-height: 1;
            padding: 4px 8px;
        }
        .close-menu:hover { color: #000; }

        .side-menu-list {
            flex: 1; overflow-y: auto;
            padding: 8px 0;
        }
        .side-menu-list a {
            display: block;
            padding: 16px 24px;
            color: #222;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.2s;
        }
        .side-menu-list a:hover {
            background: #f0f5ff;
            color: #2868ff;
            padding-left: 30px;
        }
        .side-menu-list a.active {
            background: #e6efff;
            color: #2868ff;
            font-weight: 700;
        }

        .side-menu-footer {
            padding: 16px 24px 24px;
            border-top: 1px solid #eee;
        }
        .signout-btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 8px;
            background: #e63950;
            color: #ffffff;
            font-size: 13px; font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }
        .signout-btn:hover { background: #c72f44; }

        /* =========================
           DASHBOARD
        ========================== */
        .dashboard {
            padding: 40px 0 80px;
            min-height: calc(100vh - 76px);
            position: relative;
        }
        .dashboard::before {
            content: ""; position: absolute;
            width: 520px; height: 520px;
            background: #2868ff; opacity: 0.07;
            filter: blur(100px); border-radius: 50%;
            top: 0; left: -180px; pointer-events: none;
        }
        .dashboard-container {
            width: min(1180px, 94%); margin: auto;
            position: relative; z-index: 2;
        }

        .welcome { margin-bottom: 35px; }
        .welcome h1 {
            font-size: clamp(30px, 5vw, 44px);
            line-height: 1.15;
            letter-spacing: -1.2px;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .welcome h1 span {
            background: linear-gradient(90deg, #4da3ff, #8a6cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome p { color: #8999b8; font-size: 15px; }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }
        .stat-card {
            padding: 28px;
            border-radius: 20px;
            background: #0b1230;
            border: 1px solid #192849;
            transition: 0.3s;
        }
        .stat-card:hover {
            border-color: #315ca8;
            transform: translateY(-3px);
        }
        .stat-label {
            color: #8999b8;
            font-size: 15px;
            margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }
        .stat-value small {
            font-size: 14px;
            color: #7183a7;
            font-weight: 600;
            margin-left: 6px;
        }
        .stat-value.blue { color: #62adff; }
        .stat-value.purple { color: #b18cff; }

        /* MOBILE */
        @media (max-width: 600px) {
            .nav-container { padding: 0 3%; }
            .logo { font-size: 16px; gap: 8px; }
            .logo-icon { width: 34px; height: 34px; font-size: 17px; }
            .balance-pill { font-size: 11px; padding: 6px 10px; }
            .addfunds-pill { font-size: 11px; padding: 6px 10px; }
            .menu-btn { width: 24px; height: 18px; }
            .side-menu { width: 85%; }
            .stat-value { font-size: 28px; }
            .stat-card { padding: 22px; }
        }
    </style>
</head>
<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">
                <div class="logo-icon">🚀</div>
                <div>Zavora <span>Booster</span></div>
            </a>

            <div class="nav-right">
                <div class="balance-pill">
                    💰 <span id="balance">0</span> NGN
                </div>
                <a href="add-funds.html" class="addfunds-pill">
                    + Add Funds
                </a>
                <button class="menu-btn" id="menuBtn" aria-label="Open menu">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </button>
            </div>
        </div>
    </header>

    <!-- =========================
         SLIDE-OUT MENU
    ========================== -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <aside class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <div class="brand">🚀 Zavora <span>Booster</span></div>
            <button class="close-menu" id="closeMenu" aria-label="Close menu">✕</button>
        </div>

        <nav class="side-menu-list">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="add-funds.html">Add Funds</a>
            <a href="payment-history.html">Payment History</a>
            <a href="order.html">Order</a>
            <a href="orders.html">Order History</a>
            <a href="support.html">Support</a>
            <a href="api.html">API</a>
        </nav>

        <div class="side-menu-footer">
            <button class="signout-btn" id="logoutBtn">SIGN OUT</button>
        </div>
    </aside>

    <!-- =========================
         DASHBOARD
    ========================== -->
    <main class="dashboard">
        <div class="dashboard-container">

            <div class="welcome">
                <h1>Welcome back, <span id="username">User</span> 👋</h1>
                <p>Here's what's happening with your account today.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">💰 Account Balance</div>
                    <div class="stat-value blue">
                        <span id="balanceCard">0</span><small>NGN</small>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">📦 Total Orders</div>
                    <div class="stat-value purple" id="totalOrders">0</div>
                </div>
            </div>

        </div>
    </main>

    <!-- =========================
         SCRIPT
    ========================== -->
    <script>
        // Menu toggle (runs before module script)
        const menuBtn = document.getElementById("menuBtn");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");
        const closeMenu = document.getElementById("closeMenu");

        function openMenu() {
            sideMenu.classList.add("active");
            menuOverlay.classList.add("active");
        }
        function closeMenuFn() {
            sideMenu.classList.remove("active");
            menuOverlay.classList.remove("active");
        }

        menuBtn.addEventListener("click", openMenu);
        closeMenu.addEventListener("click", closeMenuFn);
        menuOverlay.addEventListener("click", closeMenuFn);
    </script>

    <script type="module">
        import { watchAuthState, getUserProfile, logoutUser } from "./firebase-config.js";

        const usernameEl = document.getElementById("username");
        const balanceEl = document.getElementById("balance");
        const balanceCardEl = document.getElementById("balanceCard");
        const totalOrdersEl = document.getElementById("totalOrders");
        const logoutBtn = document.getElementById("logoutBtn");

        // Protect dashboard
        watchAuthState(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const result = await getUserProfile(user.uid);

            if (result.success) {
                const data = result.data;
                const name = data.username || user.email.split("@")[0];
                const balance = (data.balance || 0).toLocaleString();
                const orders = data.totalOrders || 0;

                usernameEl.textContent = name;
                balanceEl.textContent = balance;
                balanceCardEl.textContent = balance;
                totalOrdersEl.textContent = orders;
            } else {
                usernameEl.textContent = user.email.split("@")[0];
            }
        });

        // Logout
        logoutBtn.addEventListener("click", async () => {
            await logoutUser();
            window.location.href = "login.html";
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        .navbar {
            width: 100%;
            background: #050817;
            position: relative;
            z-index: 10;
        }
        .nav-container {
            width: min(1180px, 94%);
            margin: auto;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
        .logo-icon {
            width: 42px; height: 42px; border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            box-shadow: 0 8px 25px rgba(77, 163, 255, 0.25);
            font-size: 20px;
        }
        .logo span { color: #4da3ff; }
        .menu-btn {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 30px; height: 22px; background: transparent; border: none; padding: 0;
        }
        .menu-btn .bar { width: 100%; height: 3px; border-radius: 2px; background: #ffffff; }

        .page { padding: 30px 0 80px; position: relative; }
        .page-container { width: min(520px, 94%); margin: auto; }

        .auth-card {
            position: relative;
            background: #0b1230;
            border: 1px solid #1e3157;
            border-radius: 20px;
            padding: 40px 30px 34px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
        }
        .auth-card::before {
            content: "";
            position: absolute;
            top: -2px;
            left: 40px;
            right: 40px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, #2868ff, #7657ff);
            box-shadow: 0 0 20px rgba(77, 163, 255, 0.5);
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: 30px;
            background: rgba(77, 163, 255, 0.1);
            border: 1px solid rgba(77, 163, 255, 0.25);
            color: #76baff;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .auth-card h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
            line-height: 1.15;
        }
        .auth-card .subtitle {
            color: #8999b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #aeb9d4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .input-wrap { position: relative; }
        .form-input {
            width: 100%;
            padding: 15px 45px 15px 16px;
            border-radius: 12px;
            border: 1px solid #1e3157;
            background: #0a1230;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-input:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-input::placeholder { color: #566890; }
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff;
            -webkit-box-shadow: 0 0 0px 1000px #0a1230 inset;
            transition: background-color 5000s ease-in-out 0s;
        }
        .form-input.error { border-color: #ff5577; }

        .toggle-pass {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #8999b8;
            font-size: 16px;
            padding: 4px 6px;
            line-height: 1;
        }
        .toggle-pass:hover { color: #62adff; }

        .strength-bar {
            height: 4px;
            border-radius: 3px;
            background: #1a2744;
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        .strength-text {
            font-size: 11px;
            color: #7183a7;
            margin-top: 6px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 18px 0 22px;
            font-size: 13px;
            color: #8999b8;
            line-height: 1.55;
        }
        .terms input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #2868ff;
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .terms a { color: #62adff; }
        .terms a:hover { color: #8ac4ff; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.35);
            transition: 0.25s;
            margin-top: 6px;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            display: none;
            margin-top: 14px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }
        .message.show { display: block; }
        .message.error {
            background: rgba(255, 85, 119, 0.1);
            border: 1px solid rgba(255, 85, 119, 0.3);
            color: #ff8899;
        }
        .message.success {
            background: rgba(101, 230, 160, 0.1);
            border: 1px solid rgba(101, 230, 160, 0.3);
            color: #65e6a0;
        }

        .alt-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #8999b8;
        }
        .alt-link a { color: #62adff; font-weight: 700; }
        .alt-link a:hover { color: #8ac4ff; }

        footer {
            border-top: 1px solid #111e38;
            background: #040711;
            padding: 22px 0 18px;
            margin-top: 40px;
        }
        .footer-container { width: min(1180px, 94%); margin: auto; }
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            color: #53627e;
            font-size: 11px;
            flex-wrap: wrap;
            text-align: center;
        }
        .footer-bottom div { flex: 1; }

        @media (max-width: 600px) {
            .auth-card { padding: 34px 22px 28px; border-radius: 18px; }
            .auth-card h1 { font-size: 26px; }
            .footer-bottom { flex-direction: column; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>
    </div>
</header>

<main class="page">
    <div class="page-container">

        <div class="auth-card">
            <div class="secure-badge">🔒 Secure Sign Up</div>

            <h1>Create Your Account</h1>
            <p class="subtitle">It takes less than 30 seconds.</p>

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. zavoraking" required autocomplete="username" style="padding-right: 16px;">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" style="padding-right: 16px;">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" id="togglePass1">👁</button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText">Password strength</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" id="togglePass2">👁</button>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to Zavora Booster's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
                <div class="message" id="message"></div>
            </form>

            <div class="alt-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>

    </div>
</main>

<footer>
    <div class="footer-container">
        <div class="footer-bottom">
            <div>© 2026 Zavora Booster. All rights reserved.</div>
            <div>Built for digital growth.</div>
        </div>
    </div>
</footer>

<script>
    document.getElementById("menuBtn").addEventListener("click", () => {
        window.location.href = "index.html";
    });
</script>

<script type="module">
    import { registerUser } from "./firebase-config.js";

    const form = document.getElementById("registerForm");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const termsInput = document.getElementById("terms");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    document.getElementById("togglePass1").addEventListener("click", () => {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });
    document.getElementById("togglePass2").addEventListener("click", () => {
        confirmInput.type = confirmInput.type === "password" ? "text" : "password";
    });

    const strengthFill = document.getElementById("strengthFill");
    const strengthText = document.getElementById("strengthText");

    passwordInput.addEventListener("input", () => {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const configs = [
            { w: "0%",   c: "transparent", t: "Password strength" },
            { w: "20%",  c: "#ff5577",     t: "Very weak" },
            { w: "40%",  c: "#ff9955",     t: "Weak" },
            { w: "60%",  c: "#ffd955",     t: "Fair" },
            { w: "80%",  c: "#65e6a0",     t: "Strong" },
            { w: "100%", c: "#3ddc84",     t: "Very strong" }
        ];

        const cfg = configs[score];
        strengthFill.style.width = cfg.w;
        strengthFill.style.background = cfg.c;
        strengthText.textContent = cfg.t;
        strengthText.style.color = score >= 3 ? "#65e6a0" : "#7183a7";
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        [usernameInput, emailInput, passwordInput, confirmInput].forEach(i => i.classList.remove("error"));
        message.className = "message";

        if (username.length < 3) {
            usernameInput.classList.add("error");
            return showMessage("Username must be at least 3 characters.", "error");
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            emailInput.classList.add("error");
            return showMessage("Please enter a valid email.", "error");
        }
        if (password.length < 6) {
            passwordInput.classList.add("error");
            return showMessage("Password must be at least 6 characters.", "error");
        }
        if (password !== confirm) {
            confirmInput.classList.add("error");
            return showMessage("Passwords do not match.", "error");
        }
        if (!termsInput.checked) {
            return showMessage("Please accept the Terms of Service.", "error");
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        const result = await registerUser(username, email, password);

        if (result.success) {
            showMessage("✅ Account created! Redirecting...", "success");
            setTimeout(() => window.location.href = "dashboard.html", 1200);
        } else {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            let err = result.error || "Registration failed.";
            if (err.includes("email-already-in-use")) err = "This email is already registered.";
            else if (err.includes("invalid-email")) err = "Invalid email address.";
            else if (err.includes("weak-password")) err = "Password is too weak.";
            showMessage("❌ " + err, "error");
        }
    });
</script>

</body>
</html>

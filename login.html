<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: #050817;
            position: relative;
            z-index: 10;
        }
        .nav-container {
            width: min(1180px, 94%);
            margin: auto;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
        .logo-icon {
            width: 42px; height: 42px; border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            box-shadow: 0 8px 25px rgba(77, 163, 255, 0.25);
            font-size: 20px;
        }
        .logo span { color: #4da3ff; }
        .menu-btn {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 30px; height: 22px; background: transparent; border: none; padding: 0;
        }
        .menu-btn .bar { width: 100%; height: 3px; border-radius: 2px; background: #ffffff; }

        /* PAGE */
        .page {
            padding: 30px 0 80px;
            position: relative;
        }
        .page-container { width: min(520px, 94%); margin: auto; }

        /* CARD */
        .auth-card {
            position: relative;
            background: #0b1230;
            border: 1px solid #1e3157;
            border-radius: 20px;
            padding: 40px 30px 34px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
        }
        .auth-card::before {
            content: "";
            position: absolute;
            top: -2px;
            left: 40px;
            right: 40px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, #2868ff, #7657ff);
            box-shadow: 0 0 20px rgba(77, 163, 255, 0.5);
        }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: 30px;
            background: rgba(77, 163, 255, 0.1);
            border: 1px solid rgba(77, 163, 255, 0.25);
            color: #76baff;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .auth-card h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
            line-height: 1.15;
        }
        .auth-card .subtitle {
            color: #8999b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #aeb9d4;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .input-wrap { position: relative; }
        .form-input {
            width: 100%;
            padding: 15px 45px 15px 16px;
            border-radius: 12px;
            border: 1px solid #1e3157;
            background: #0a1230;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-input:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-input::placeholder { color: #566890; }
        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff;
            -webkit-box-shadow: 0 0 0px 1000px #0a1230 inset;
            transition: background-color 5000s ease-in-out 0s;
        }
        .form-input.error { border-color: #ff5577; }

        .toggle-pass {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #8999b8;
            font-size: 16px;
            padding: 4px 6px;
            line-height: 1;
        }
        .toggle-pass:hover { color: #62adff; }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #62adff;
            font-weight: 600;
            margin-top: -6px;
            margin-bottom: 20px;
        }
        .forgot-link:hover { color: #8ac4ff; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.35);
            transition: 0.25s;
            margin-top: 6px;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            display: none;
            margin-top: 14px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }
        .message.show { display: block; }
        .message.error {
            background: rgba(255, 85, 119, 0.1);
            border: 1px solid rgba(255, 85, 119, 0.3);
            color: #ff8899;
        }
        .message.success {
            background: rgba(101, 230, 160, 0.1);
            border: 1px solid rgba(101, 230, 160, 0.3);
            color: #65e6a0;
        }

        .alt-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #8999b8;
        }
        .alt-link a { color: #62adff; font-weight: 700; }
        .alt-link a:hover { color: #8ac4ff; }

        /* FOOTER */
        footer {
            border-top: 1px solid #111e38;
            background: #040711;
            padding: 22px 0 18px;
            margin-top: 40px;
        }
        .footer-container { width: min(1180px, 94%); margin: auto; }
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            color: #53627e;
            font-size: 11px;
            flex-wrap: wrap;
            text-align: center;
        }
        .footer-bottom div { flex: 1; }

        @media (max-width: 600px) {
            .auth-card { padding: 34px 22px 28px; border-radius: 18px; }
            .auth-card h1 { font-size: 26px; }
            .footer-bottom { flex-direction: column; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>
    </div>
</header>

<main class="page">
    <div class="page-container">

        <div class="auth-card">
            <div class="secure-badge">🔒 Secure Login</div>

            <h1>Login To Your Account</h1>
            <p class="subtitle">Enter your credentials to continue.</p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" class="form-input" placeholder="Your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pass" id="togglePass">👁</button>
                    </div>
                </div>

                <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>

                <button type="submit" class="submit-btn" id="submitBtn">Login</button>
                <div class="message" id="message"></div>
            </form>

            <div class="alt-link">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>

    </div>
</main>

<footer>
    <div class="footer-container">
        <div class="footer-bottom">
            <div>© 2026 Zavora Booster. All rights reserved.</div>
            <div>Built for digital growth.</div>
        </div>
    </div>
</footer>

<script>
    // Simple menu toggle (no side menu on this page — just toast)
    document.getElementById("menuBtn").addEventListener("click", () => {
        window.location.href = "index.html";
    });
</script>

<script type="module">
    import { loginUser, resetPassword, watchAuthState } from "./firebase-config.js";

    // Redirect if already logged in
    watchAuthState((user) => {
        if (user) window.location.href = "dashboard.html";
    });

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const forgotLink = document.getElementById("forgotLink");

    document.getElementById("togglePass").addEventListener("click", () => {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    });

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        [emailInput, passwordInput].forEach(i => i.classList.remove("error"));
        message.className = "message";

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            emailInput.classList.add("error");
            return showMessage("Please enter a valid email.", "error");
        }
        if (password.length < 6) {
            passwordInput.classList.add("error");
            return showMessage("Password must be at least 6 characters.", "error");
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        const result = await loginUser(email, password);

        if (result.success) {
            showMessage("✅ Login successful! Redirecting...", "success");
            setTimeout(() => window.location.href = "dashboard.html", 900);
        } else {
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
            let err = result.error || "Login failed.";
            if (err.includes("user-not-found")) err = "No account found with this email.";
            else if (err.includes("wrong-password")) err = "Incorrect password.";
            else if (err.includes("invalid-credential")) err = "Invalid email or password.";
            showMessage("❌ " + err, "error");
        }
    });

    // Forgot password
    forgotLink.addEventListener("click", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
            return showMessage("Enter your email first, then click Forgot password.", "error");
        }
        const result = await resetPassword(email);
        if (result.success) {
            showMessage("✅ Password reset link sent to your email.", "success");
        } else {
            showMessage("❌ " + result.error, "error");
        }
    });
</script>

</body>
</html>

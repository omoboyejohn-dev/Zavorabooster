<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #ffffff;
            line-height: 1.6; min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        .navbar {
            width: 100%; position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(77, 163, 255, 0.12);
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 68px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
        .logo-icon {
            width: 36px; height: 36px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            font-size: 18px;
        }
        .logo span { color: #4da3ff; }

        .nav-right { display: flex; align-items: center; gap: 8px; }
        .balance-pill {
            padding: 7px 12px; border-radius: 10px;
            background: rgba(77, 163, 255, 0.08);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: #76baff; font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }
        .balance-pill span { color: #ffffff; }
        .menu-btn {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 26px; height: 18px; background: transparent;
            border: none; padding: 0;
        }
        .menu-btn .bar {
            width: 100%; height: 3px; border-radius: 2px;
            background: #ffffff; transition: 0.3s;
        }

        /* MENU */
        .menu-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            opacity: 0; pointer-events: none;
            transition: 0.3s; z-index: 1500;
        }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }
        .side-menu {
            position: fixed; top: 0; right: -360px;
            width: 280px; max-width: 82vw;
            height: 100vh;
            background: #0b1230;
            border-left: 1px solid #1e3157;
            z-index: 1600; transition: right 0.35s ease;
            display: flex; flex-direction: column;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
        }
        .side-menu.active { right: 0; }
        .side-menu-header {
            padding: 20px 22px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #1e3157;
            background: #070c21;
        }
        .side-menu-header .brand {
            font-size: 16px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
        }
        .side-menu-header .brand span { color: #4da3ff; }
        .close-menu {
            background: transparent; border: none;
            font-size: 20px; color: #aeb9d4;
            padding: 4px 8px;
        }
        .close-menu:hover { color: #ffffff; }
        .side-menu-list { flex: 1; overflow-y: auto; padding: 6px 0; }
        .side-menu-list a {
            display: block;
            padding: 14px 22px;
            color: #aeb9d4;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid #14204a;
            transition: 0.2s;
        }
        .side-menu-list a:hover {
            background: rgba(77, 163, 255, 0.08);
            color: #ffffff;
            padding-left: 28px;
        }
        .side-menu-list a.active {
            background: rgba(77, 163, 255, 0.12);
            color: #62adff;
            font-weight: 700;
            border-left: 3px solid #4da3ff;
            padding-left: 19px;
        }
        .side-menu-list a.admin-link {
            color: #ff8899;
            background: rgba(255, 85, 119, 0.06);
            font-weight: 800;
        }
        .side-menu-list a.admin-link:hover {
            background: rgba(255, 85, 119, 0.15);
            color: #ff5577;
            padding-left: 28px;
        }
        .side-menu-footer {
            padding: 14px 22px 22px;
            border-top: 1px solid #1e3157;
        }
        .signout-btn {
            width: 100%; padding: 13px;
            border: none; border-radius: 8px;
            background: #e63950;
            color: #ffffff;
            font-size: 12px; font-weight: 800;
            letter-spacing: 1px; transition: 0.2s;
        }
        .signout-btn:hover { background: #c72f44; }

        /* PAGE */
        .page { padding: 30px 0 80px; position: relative; }
        .page-container { width: min(1180px, 94%); margin: auto; }

        .page-header {
            display: flex; justify-content: space-between;
            align-items: center; gap: 15px;
            flex-wrap: wrap; margin-bottom: 22px;
        }
        .page-header h1 {
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 800; letter-spacing: -0.8px;
        }
        .page-header p { color: #8999b8; font-size: 13px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .filter-select {
            padding: 9px 12px; border-radius: 9px;
            border: 1px solid #1e3157;
            background: #0a1230; color: #ffffff;
            font-size: 12px; font-weight: 700;
            outline: none; font-family: inherit;
            cursor: pointer;
        }
        .filter-select option { background: #0a1230; }
        .search-btn {
            padding: 9px 12px; border-radius: 9px;
            background: rgba(77, 163, 255, 0.1);
            border: 1px solid rgba(77, 163, 255, 0.3);
            color: #62adff; font-size: 14px;
        }

        /* TABLE */
        .orders-card {
            background: #0b1230;
            border: 1px solid #192849;
            border-radius: 16px;
            overflow: hidden;
        }
        .orders-table {
            width: 100%; border-collapse: collapse;
            font-size: 13px;
        }
        .orders-table thead th {
            text-align: left;
            padding: 14px 12px;
            background: #070c21;
            color: #8999b8;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #1e3157;
        }
        .orders-table thead th.center { text-align: center; }
        .orders-table tbody td {
            padding: 15px 12px;
            color: #dce6fb;
            vertical-align: middle;
            border-bottom: 1px solid #14204a;
        }
        .orders-table tbody tr:hover td { background: rgba(77, 163, 255, 0.03); }

        .id-cell { font-family: monospace; color: #aeb9d4; font-size: 12px; }
        .service-cell { font-weight: 700; color: #ffffff; }
        .qty-cell { color: #62adff; font-weight: 700; }
        .center { text-align: center; }

        .badge {
            display: inline-block; padding: 4px 11px;
            border-radius: 20px; font-size: 11px; font-weight: 700;
        }
        .badge-pending { background: rgba(255, 200, 85, 0.15); color: #ffc855; border: 1px solid rgba(255, 200, 85, 0.3); }
        .badge-processing { background: rgba(77, 163, 255, 0.15); color: #62adff; border: 1px solid rgba(77, 163, 255, 0.3); }
        .badge-completed { background: rgba(101, 230, 160, 0.15); color: #65e6a0; border: 1px solid rgba(101, 230, 160, 0.3); }
        .badge-cancelled { background: rgba(255, 85, 119, 0.15); color: #ff8899; border: 1px solid rgba(255, 85, 119, 0.3); }

        .expand-btn {
            background: transparent; border: none;
            color: #8999b8; font-size: 14px;
            padding: 5px 8px; transition: 0.2s;
            transform: rotate(0deg);
        }
        .expand-btn.open { transform: rotate(180deg); color: #62adff; }
        .expand-btn:hover { color: #ffffff; }

        .details-row { display: none; }
        .details-row.open { display: table-row; }
        .details-row td {
            background: #0a1230 !important;
            padding: 0 !important;
            border-bottom: 1px solid #1e3157 !important;
        }
        .details-content {
            padding: 20px 22px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            font-size: 13px;
            line-height: 1.8;
        }
        .details-content .row-detail {
            display: flex; gap: 10px;
            color: #dce6fb;
            flex-wrap: wrap;
        }
        .details-content .row-detail .label {
            font-weight: 800; color: #ffffff;
            min-width: 140px;
        }
        .details-content .row-detail .value {
            color: #aeb9d4;
            word-break: break-all;
        }
        .details-content .row-detail .value.link {
            color: #62adff;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #7183a7;
        }
        .empty-state .big-icon {
            font-size: 50px; margin-bottom: 15px; opacity: 0.6;
        }
        .empty-state h3 {
            color: #ffffff; font-size: 17px;
            margin-bottom: 8px; font-weight: 800;
        }
        .empty-state p { font-size: 13px; margin-bottom: 20px; }
        .empty-state a {
            display: inline-block; padding: 12px 22px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; font-size: 13px; font-weight: 800;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.35);
        }

        footer {
            border-top: 1px solid #111e38;
            background: #040711; padding: 22px 0 18px;
        }
        .footer-container { width: min(1180px, 94%); margin: auto; }
        .footer-bottom {
            display: flex; justify-content: space-between;
            gap: 20px; color: #53627e; font-size: 11px;
            flex-wrap: wrap; text-align: center;
        }
        .footer-bottom div { flex: 1; }

        @media (max-width: 700px) {
            .orders-table { font-size: 12px; }
            .orders-table thead th { padding: 12px 8px; font-size: 10px; }
            .orders-table tbody td { padding: 12px 8px; }
            .details-content { padding: 16px; }
            .details-content .row-detail .label { min-width: 100px; font-size: 12px; }
            .details-content .row-detail .value { font-size: 12px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <div class="nav-right">
            <div class="balance-pill">
                💰 <span id="balance">0</span> NGN
            </div>
            <button class="menu-btn" id="menuBtn" aria-label="Open menu">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </button>
        </div>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay"></div>

<aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
        <div class="brand">🚀 Zavora <span>Booster</span></div>
        <button class="close-menu" id="closeMenu" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-menu-list">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="add-funds.html">Add Funds</a>
        <a href="payment-history.html">Payment History</a>
        <a href="orders.html" class="active">Order History</a>
        <a href="support.html">Support</a>
        <a href="api.html">API</a>
        <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">👑 Admin Panel</a>
    </nav>
    <div class="side-menu-footer">
        <button class="signout-btn" id="logoutBtn">SIGN OUT</button>
    </div>
</aside>

<main class="page">
    <div class="page-container">
        <div class="page-header">
            <div>
                <h1>📋 Orders History</h1>
                <p>View and track all your orders here.</p>
            </div>
            <div class="header-actions">
                <select id="filterStatus" class="filter-select">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <button class="search-btn" id="refreshBtn">🔄</button>
            </div>
        </div>

        <div class="orders-card">
            <table class="orders-table" id="ordersTable">
                <thead>
                    <tr>
                        <th style="width:100px;">ID</th>
                        <th>Service</th>
                        <th class="center" style="width:80px;">Qty</th>
                        <th class="center" style="width:130px;">Status</th>
                        <th style="width:40px;"></th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr><td colspan="5" class="empty-state">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer>
    <div class="footer-container">
        <div class="footer-bottom">
            <div>© 2026 Zavora Booster. All rights reserved.</div>
            <div>Built for digital growth.</div>
        </div>
    </div>
</footer>

<script>
    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");
    const closeMenu = document.getElementById("closeMenu");

    function openMenu() {
        sideMenu.classList.add("active");
        menuOverlay.classList.add("active");
    }
    function closeMenuFn() {
        sideMenu.classList.remove("active");
        menuOverlay.classList.remove("active");
    }
    menuBtn.addEventListener("click", openMenu);
    closeMenu.addEventListener("click", closeMenuFn);
    menuOverlay.addEventListener("click", closeMenuFn);
</script>

<script type="module">
    import { db, watchAuthState, getUserProfile, logoutUser } from "./firebase-config.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const ordersBody = document.getElementById("ordersBody");
    const filterStatus = document.getElementById("filterStatus");
    const refreshBtn = document.getElementById("refreshBtn");
    const balanceEl = document.getElementById("balance");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminLink = document.getElementById("adminLink");

    let currentUser = null;
    let allOrders = [];

    watchAuthState(async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUser = user;

        const profile = await getUserProfile(user.uid);
        if (profile.success) {
            balanceEl.textContent = (profile.data.balance || 0).toLocaleString();
            if (profile.data.role === "admin") {
                adminLink.style.display = "block";
            }
        }

        loadOrders();
    });

    async function loadOrders() {
        if (!currentUser) return;
        ordersBody.innerHTML = '<tr><td colspan="5" class="empty-state">Loading orders...</td></tr>';

        try {
            const q = query(
                collection(db, "orders"),
                where("userId", "==", currentUser.uid)
            );
            const snap = await getDocs(q);

            allOrders = [];
            snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));

            allOrders.sort((a, b) => {
                const ta = a.createdAt?.toDate?.()?.getTime() || 0;
                const tb = b.createdAt?.toDate?.()?.getTime() || 0;
                return tb - ta;
            });

            renderOrders();
        } catch (err) {
            ordersBody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ff8899;">Error: ${err.message}</td></tr>`;
        }
    }

    function renderOrders() {
        const filter = filterStatus.value;
        const filtered = filter === "all"
            ? allOrders
            : allOrders.filter(o => (o.status || "pending") === filter);

        if (!filtered.length) {
            ordersBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-state">
                        <div class="big-icon">📭</div>
                        <h3>No orders yet</h3>
                        <p>Place your first order and watch your growth begin.</p>
                        <a href="order.html">🚀 Place Your First Order</a>
                    </td>
                </tr>`;
            return;
        }

        let html = "";
        filtered.forEach((o, i) => {
            const status = (o.status || "pending").toLowerCase();
            const badgeClass = "badge-" + status;
            const shortId = o.id.slice(0, 8).toUpperCase();

            html += `
                <tr class="order-row">
                    <td class="id-cell">${shortId}</td>
                    <td class="service-cell">${o.serviceName || "—"} - ${o.platform || ""}</td>
                    <td class="center qty-cell">${(o.quantity || 0).toLocaleString()}</td>
                    <td class="center"><span class="badge ${badgeClass}">${capitalize(status)}</span></td>
                    <td class="center">
                        <button class="expand-btn" data-target="details-${i}">⌄</button>
                    </td>
                </tr>
                <tr class="details-row" id="details-${i}">
                    <td colspan="5">
                        <div class="details-content">
                            <div class="row-detail">
                                <span class="label">Price :</span>
                                <span class="value">${(o.totalPrice || 0).toLocaleString()} NGN</span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Link :</span>
                                <span class="value link"><a href="${o.link || '#'}" target="_blank" style="color:#62adff;">${o.link || "—"}</a></span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Category name :</span>
                                <span class="value">${o.type || ""} ${o.serviceName || ""} ${o.platform || ""}</span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Start Count :</span>
                                <span class="value">${o.startCount || 0}</span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Remains :</span>
                                <span class="value">${o.remains || 0}</span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Date :</span>
                                <span class="value">${formatDate(o.createdAt)}</span>
                            </div>
                            <div class="row-detail">
                                <span class="label">Completed in :</span>
                                <span class="value">${formatDuration(o.createdAt, o.completedAt)}</span>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        });

        ordersBody.innerHTML = html;

        document.querySelectorAll(".expand-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const target = document.getElementById(btn.dataset.target);
                const isOpen = target.classList.contains("open");
                if (isOpen) {
                    target.classList.remove("open");
                    btn.classList.remove("open");
                } else {
                    target.classList.add("open");
                    btn.classList.add("open");
                }
            });
        });
    }

    function capitalize(s) {
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function formatDate(ts) {
        if (!ts) return "—";
        const d = ts.toDate?.() || new Date(ts);
        return d.toLocaleString("en-GB", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
    }

    function formatDuration(start, end) {
        if (!start) return "—";
        const s = start.toDate?.() || new Date(start);
        const e = end ? (end.toDate?.() || new Date(end)) : new Date();
        const ms = e - s;
        const hours = Math.floor(ms / 3600000);
        const mins = Math.floor((ms % 3600000) / 60000);
        const secs = Math.floor((ms % 60000) / 1000);
        return `${hours} Hr , ${mins} Mins , ${secs} Secs`;
    }

    filterStatus.addEventListener("change", renderOrders);
    refreshBtn.addEventListener("click", loadOrders);

    logoutBtn.addEventListener("click", async () => {
        await logoutUser();
        window.location.href = "login.html";
    });
</script>

</body>
</html>

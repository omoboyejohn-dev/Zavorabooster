<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #ffffff;
            line-height: 1.6; min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        .navbar {
            width: 100%; position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(77, 163, 255, 0.12);
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 76px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            font-size: 21px;
        }
        .logo span { color: #4da3ff; }
        .back-btn {
            padding: 9px 16px; border-radius: 10px;
            background: rgba(77, 163, 255, 0.08);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: #76baff; font-size: 13px; font-weight: 700;
        }
        .back-btn:hover { background: rgba(77, 163, 255, 0.15); }

        .order-wrapper {
            padding: 40px 0 80px;
        }
        .order-container {
            width: min(720px, 94%); margin: auto;
        }
        .platform-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 30px;
        }
        .platform-header .icon-box {
            width: 60px; height: 60px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            background: #1e3157;
            border: 1px solid #315ca8;
        }
        .platform-header h1 {
            font-size: 28px; font-weight: 800;
            letter-spacing: -0.5px;
        }
        .platform-header p { color: #8999b8; font-size: 13px; }

        .form-card {
            padding: 32px;
            border-radius: 20px;
            background: #0b1230;
            border: 1px solid #192849;
        }

        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; font-size: 13px;
            font-weight: 700; color: #aeb9d4;
            margin-bottom: 8px;
        }
        .form-input, .form-select {
            width: 100%; padding: 14px 16px;
            border-radius: 12px; border: 1px solid #1e3157;
            background: #0a1230; color: #ffffff;
            font-size: 14px; outline: none;
            transition: 0.25s ease;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-select option { background: #0a1230; color: #ffffff; }
        .hint { color: #7183a7; font-size: 12px; margin-top: 6px; }

        .price-row {
            display: flex; align-items: center; gap: 14px;
            margin-top: 4px;
        }
        .price-badge {
            background: #00c853;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .price-rate { color: #8999b8; font-size: 13px; }

        .readonly-box {
            background: #0a1230;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #1e3157;
            color: #aeb9d4;
            font-size: 14px;
        }

        .note-box {
            background: rgba(255, 210, 100, 0.05);
            border: 1px solid rgba(255, 210, 100, 0.2);
            border-radius: 12px;
            padding: 18px;
            font-size: 13px;
            line-height: 1.8;
            color: #dce6fb;
        }
        .note-box ol { margin-left: 20px; }
        .note-box ol li { margin-bottom: 6px; }

        .purchase-btn {
            width: 100%; padding: 16px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; font-size: 15px; font-weight: 800;
            cursor: pointer; transition: 0.25s;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.3);
            letter-spacing: 0.5px;
        }
        .purchase-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .purchase-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            display: none; margin-top: 16px;
            padding: 12px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; text-align: center;
        }
        .message.show { display: block; }
        .message.error {
            background: rgba(255, 85, 119, 0.1);
            border: 1px solid rgba(255, 85, 119, 0.3);
            color: #ff8899;
        }
        .message.success {
            background: rgba(101, 230, 160, 0.1);
            border: 1px solid rgba(101, 230, 160, 0.3);
            color: #65e6a0;
        }

        .loading {
            text-align: center; padding: 60px 20px;
            color: #8999b8;
        }
        .loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1e3157;
            border-top-color: #4da3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .order-container { width: 92%; }
            .form-card { padding: 22px; }
            .platform-header h1 { font-size: 22px; }
            .platform-header .icon-box { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <a href="dashboard.html" class="back-btn">← Back</a>
    </div>
</header>

<main class="order-wrapper">
    <div class="order-container" id="orderContainer">
        <div class="loading">
            <div class="spinner"></div>
            Loading services...
        </div>
    </div>
</main>

<script type="module">
    import { db, auth, watchAuthState } from "./firebase-config.js";
    import {
        collection, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Get platform from URL
    const params = new URLSearchParams(window.location.search);
    const platform = params.get("platform") || "TikTok";

    const container = document.getElementById("orderContainer");

    // Platform icons map
    const platformIcons = {
        "Facebook":  { bg: "#1877F2", svg: '<svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>' },
        "Instagram": { bg: "linear-gradient(135deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5)", svg: '<svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8z"/></svg>' },
        "TikTok":    { bg: "#000000", svg: '<svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/></svg>' },
        "YouTube":   { bg: "#FF0000", svg: '<svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>' },
        "Twitter":   { bg: "#000000", svg: '<svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' },
        "More":      { bg: "#1e3157", svg: '<span style="color:#62adff;font-size:26px;">•••</span>' }
    };

    // Guard: user must be logged in
    watchAuthState((user) => {
        if (!user) window.location.href = "login.html";
    });

    // Load services for this platform
    async function loadServices() {
        try {
            const q = query(
                collection(db, "services"),
                where("category", "==", platform),
                where("status", "==", "active")
            );
            const snap = await getDocs(q);

            if (snap.empty) {
                container.innerHTML = `
                    <div class="form-card" style="text-align:center;padding:60px 30px;">
                        <div style="font-size:48px;margin-bottom:15px;">📭</div>
                        <h2 style="margin-bottom:10px;">No services yet</h2>
                        <p style="color:#8999b8;font-size:14px;">
                            Services for <b>${platform}</b> haven't been added yet.<br>
                            Please check back later.
                        </p>
                    </div>`;
                return;
            }

            // Build services array
            const services = [];
            snap.forEach(d => services.push({ id: d.id, ...d.data() }));

            renderForm(services);
        } catch (err) {
            container.innerHTML = `
                <div class="form-card" style="text-align:center;padding:60px 30px;">
                    <div style="font-size:48px;margin-bottom:15px;">⚠️</div>
                    <h2 style="margin-bottom:10px;">Could not load services</h2>
                    <p style="color:#8999b8;font-size:13px;">${err.message}</p>
                </div>`;
        }
    }

    function renderForm(services) {
        const icon = platformIcons[platform] || platformIcons["More"];

        container.innerHTML = `
            <div class="platform-header">
                <div class="icon-box" style="background:${icon.bg};">${icon.svg}</div>
                <div>
                    <h1>${platform} Boost</h1>
                    <p>Choose a service and place your order</p>
                </div>
            </div>

            <div class="form-card">
                <form id="orderForm">

                    <div class="form-group">
                        <label for="service">Service:</label>
                        <select id="service" class="form-select" required>
                            <option value="" disabled selected>Select a service</option>
                            ${services.map((s, i) =>
                                `<option value="${s.id}" data-index="${i}">${s.serviceName}</option>`
                            ).join("")}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" class="form-select" disabled required>
                            <option value="" disabled selected>Select a type</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="link" id="linkLabel">Account Link:</label>
                        <input type="url" id="link" class="form-input" placeholder="https://..." required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" class="form-input" placeholder="Enter quantity" min="1" required>
                        <div class="hint" id="quantityHint">(Min: 0 - Max: 0)</div>
                    </div>

                    <div class="form-group">
                        <label>Price:</label>
                        <div class="price-row">
                            <span class="price-badge" id="totalPrice">0 NGN</span>
                            <span class="price-rate" id="priceRate">— NGN / 1k</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Average completion time:</label>
                        <div class="readonly-box" id="completionTime">—</div>
                    </div>

                    <div class="form-group">
                        <label>Note:</label>
                        <div class="note-box" id="noteBox">
                            <p style="color:#8999b8;">Select a service to see the notes.</p>
                        </div>
                    </div>

                    <button type="submit" class="purchase-btn" id="purchaseBtn" disabled>
                        PURCHASE
                    </button>

                    <div class="message" id="message"></div>
                </form>
            </div>
        `;

        // Attach logic
        const serviceSelect = document.getElementById("service");
        const typeSelect = document.getElementById("type");
        const linkInput = document.getElementById("link");
        const linkLabel = document.getElementById("linkLabel");
        const qtyInput = document.getElementById("quantity");
        const qtyHint = document.getElementById("quantityHint");
        const totalPrice = document.getElementById("totalPrice");
        const priceRate = document.getElementById("priceRate");
        const completionTime = document.getElementById("completionTime");
        const noteBox = document.getElementById("noteBox");
        const purchaseBtn = document.getElementById("purchaseBtn");
        const message = document.getElementById("message");

        let selectedService = null;

        function showMessage(t, type) {
            message.textContent = t;
            message.className = "message show " + type;
        }

        // When a service is chosen
        serviceSelect.addEventListener("change", () => {
            const idx = serviceSelect.selectedOptions[0].dataset.index;
            selectedService = services[idx];

            // Populate Type dropdown
            const types = selectedService.types || [selectedService.type || "Default"];
            typeSelect.innerHTML = '<option value="" disabled selected>Select a type</option>' +
                types.map((t, i) => {
                    const price = selectedService.pricePer1k;
                    const label = t.name ? `${t.name} — ${t.pricePer1k.toLocaleString()} NGN / 1k` : t;
                    return `<option value="${i}" data-price="${t.pricePer1k || price}" data-time="${t.time || selectedService.deliveryTime}">${label}</option>`;
                }).join("");
            typeSelect.disabled = false;

            // Update link label
            linkLabel.textContent = (selectedService.linkLabel || "Account Link") + ":";
            linkInput.placeholder = `Enter ${selectedService.linkLabel || "link"}`;

            // Quantity range
            qtyInput.min = selectedService.minQuantity || 1;
            qtyInput.max = selectedService.maxQuantity || 1000000;
            qtyHint.textContent = `(Min: ${selectedService.minQuantity.toLocaleString()} - Max: ${selectedService.maxQuantity.toLocaleString()})`;

            // Time
            completionTime.textContent = selectedService.deliveryTime || "—";

            // Notes
            if (selectedService.note) {
                noteBox.innerHTML = `<ol>${selectedService.note}</ol>`;
            } else {
                noteBox.innerHTML = `<p style="color:#8999b8;">No additional notes.</p>`;
            }

            // Reset
            qtyInput.value = "";
            totalPrice.textContent = "0 NGN";
            purchaseBtn.disabled = true;
            priceRate.textContent = `${selectedService.pricePer1k.toLocaleString()} NGN / 1k`;
        });

        // When type is chosen
        typeSelect.addEventListener("change", () => {
            const opt = typeSelect.selectedOptions[0];
            const price = parseFloat(opt.dataset.price);
            const time = opt.dataset.time;

            priceRate.textContent = `${price.toLocaleString()} NGN / 1k`;
            completionTime.textContent = time || "—";
            selectedService._currentPrice = price;

            updatePrice();
        });

        // When quantity changes
        qtyInput.addEventListener("input", updatePrice);

        function updatePrice() {
            if (!selectedService || !selectedService._currentPrice) return;

            const qty = parseFloat(qtyInput.value) || 0;
            const min = selectedService.minQuantity || 0;
            const max = selectedService.maxQuantity || 1000000;

            if (qty < min) {
                totalPrice.textContent = "0 NGN";
                purchaseBtn.disabled = true;
                return;
            }
            if (qty > max) {
                totalPrice.textContent = "0 NGN";
                purchaseBtn.disabled = true;
                return;
            }

            const total = (qty / 1000) * selectedService._currentPrice;
            totalPrice.textContent = total.toLocaleString(undefined, { maximumFractionDigits: 0 }) + " NGN";
            purchaseBtn.disabled = false;
        }

        // Submit order
        document.getElementById("orderForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!selectedService || !selectedService._currentPrice) {
                return showMessage("Please select a service and type.", "error");
            }

            const qty = parseFloat(qtyInput.value);
            const link = linkInput.value.trim();

            if (!link) return showMessage("Please enter your link.", "error");
            if (qty < selectedService.minQuantity || qty > selectedService.maxQuantity) {
                return showMessage("Quantity out of range.", "error");
            }

            // TODO: Save order + deduct balance + call provider API
            showMessage("⏳ Processing your order...", "success");
            purchaseBtn.disabled = true;

            // Placeholder — real logic in next step
            setTimeout(() => {
                showMessage("✅ Order placed! Check Order History.", "success");
                setTimeout(() => window.location.href = "orders.html", 1200);
            }, 1000);
        });
    }

    loadServices();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #ffffff;
            line-height: 1.6; min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* NAVBAR */
        .navbar {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(77, 163, 255, 0.12);
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 72px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; }
        .logo-icon {
            width: 38px; height: 38px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            font-size: 19px;
        }
        .logo span { color: #4da3ff; }
        .back-btn {
            padding: 9px 16px; border-radius: 10px;
            background: rgba(77, 163, 255, 0.08);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: #76baff; font-size: 13px; font-weight: 700;
        }
        .back-btn:hover { background: rgba(77, 163, 255, 0.15); }

        /* ORDER WRAPPER */
        .order-wrapper { padding: 35px 0 80px; }
        .order-container { width: min(680px, 94%); margin: auto; }

        .platform-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 25px;
        }
        .platform-header .icon-box {
            width: 56px; height: 56px;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
        }
        .platform-header .icon-box svg { width: 28px; height: 28px; }
        .platform-header h1 {
            font-size: 24px; font-weight: 800;
            letter-spacing: -0.5px; line-height: 1.2;
        }
        .platform-header p { color: #8999b8; font-size: 13px; }

        .form-card {
            padding: 28px;
            border-radius: 20px;
            background: #0b1230;
            border: 1px solid #192849;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px;
            font-weight: 700; color: #aeb9d4;
            margin-bottom: 8px;
        }
        .form-input, .form-select {
            width: 100%; padding: 13px 15px;
            border-radius: 12px; border: 1px solid #1e3157;
            background: #0a1230; color: #ffffff;
            font-size: 14px; outline: none;
            transition: 0.25s ease;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-select option { background: #0a1230; color: #ffffff; }
        .form-input:disabled, .form-select:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
        .hint { color: #7183a7; font-size: 12px; margin-top: 6px; }

        .price-row {
            display: flex; align-items: center; gap: 14px;
            margin-top: 4px; flex-wrap: wrap;
        }
        .price-badge {
            background: #00c853;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .price-rate { color: #8999b8; font-size: 13px; }

        .readonly-box {
            background: #0a1230;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #1e3157;
            color: #aeb9d4;
            font-size: 14px;
        }

        .note-box {
            background: rgba(255, 210, 100, 0.05);
            border: 1px solid rgba(255, 210, 100, 0.2);
            border-radius: 12px;
            padding: 18px;
            font-size: 13px;
            line-height: 1.8;
            color: #dce6fb;
        }
        .note-box ol { margin-left: 20px; }
        .note-box ol li { margin-bottom: 6px; }

        .purchase-btn {
            width: 100%; padding: 15px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; font-size: 15px; font-weight: 800;
            cursor: pointer; transition: 0.25s;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.3);
            letter-spacing: 0.5px;
        }
        .purchase-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .purchase-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            display: none; margin-top: 16px;
            padding: 12px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; text-align: center;
        }
        .message.show { display: block; }
        .message.error {
            background: rgba(255, 85, 119, 0.1);
            border: 1px solid rgba(255, 85, 119, 0.3);
            color: #ff8899;
        }
        .message.success {
            background: rgba(101, 230, 160, 0.1);
            border: 1px solid rgba(101, 230, 160, 0.3);
            color: #65e6a0;
        }

        .loading {
            text-align: center; padding: 60px 20px;
            color: #8999b8;
        }
        .loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1e3157;
            border-top-color: #4da3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .order-container { width: 92%; }
            .form-card { padding: 22px; }
            .platform-header h1 { font-size: 20px; }
            .platform-header .icon-box { width: 50px; height: 50px; }
            .price-badge { font-size: 17px; padding: 8px 15px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <a href="dashboard.html" class="back-btn">← Back</a>
    </div>
</header>

<main class="order-wrapper">
    <div class="order-container" id="orderContainer">
        <div class="loading">
            <div class="spinner"></div>
            Loading services...
        </div>
    </div>
</main>

        "Snapchat":  { bg: "#FFFC00", svg: '<svg viewBox="0 0 24 24" fill="black"><path d="M12.206.793c.99 0 4.347.276 5.93 3.821.529 1.193.403 3.219.299 4.847l-.003.06c-.012.18-.022.345-.03.51.075.045.203.09.401.09.3-.016.659-.12 1.033-.301.165-.088.344-.104.464-.104.182 0 .359.029.509.09.45.149.734.479.734.838.015.449-.39.839-1.213 1.168-.089.029-.209.075-.344.119-.45.135-1.139.36-1.333.81-.09.224-.061.524.12.868l.015.015c.06.136 1.526 3.475 4.791 4.014.255.044.435.27.42.509 0 .075-.015.149-.045.225-.24.569-1.273.988-3.146 1.271-.059.091-.12.375-.164.57-.029.179-.074.36-.134.553-.076.271-.27.405-.555.405h-.03c-.135 0-.313-.031-.538-.074-.36-.075-.765-.135-1.273-.135-.3 0-.599.015-.913.074-.6.104-1.123.464-1.723.884-.853.599-1.826 1.288-3.294 1.288-.06 0-.119-.015-.18-.015h-.149c-1.468 0-2.427-.675-3.279-1.288-.599-.42-1.107-.779-1.707-.884-.314-.045-.629-.074-.928-.074-.54 0-.958.089-1.272.149-.211.043-.391.074-.54.074-.374 0-.523-.224-.583-.42-.061-.192-.09-.389-.135-.567-.046-.181-.105-.494-.166-.57-1.918-.222-2.95-.642-3.189-1.226-.031-.063-.052-.15-.055-.225-.015-.243.165-.465.42-.509 3.264-.54 4.73-3.879 4.791-4.02l.016-.029c.18-.345.224-.645.119-.869-.195-.434-.884-.658-1.332-.809-.121-.029-.24-.074-.346-.119-1.107-.435-1.257-.93-1.197-1.273.09-.479.674-.793 1.168-.793.146 0 .27.029.383.074.42.194.789.3 1.104.3.234 0 .384-.06.465-.105l-.046-.569c-.098-1.626-.225-3.651.307-4.837C7.392 1.077 10.739.807 11.727.807l.419-.015h.06z"/></svg>' },
        "LinkedIn":  { bg: "#0A66C2", svg: '<svg viewBox="0 0 24 24" fill="white"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>' },
        "Spotify":   { bg: "#1DB954", svg: '<svg viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"/></svg>' },
        "Reddit":    { bg: "#FF4500", svg: '<svg viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12c0 3.314 1.343 6.314 3.515 8.485l-2.286 2.286C.775 23.225 1.097 24 1.738 24H12c6.627 0 12-5.373 12-12S18.627 0 12 0zm4.388 3.199c1.104 0 1.999.895 1.999 1.999 0 1.105-.895 2-1.999 2-.946 0-1.739-.657-1.947-1.539v.002c-1.147.162-2.032 1.15-2.032 2.341v.007c1.776.067 3.4.567 4.686 1.363.473-.363 1.064-.58 1.707-.58 1.547 0 2.802 1.254 2.802 2.802 0 1.117-.655 2.081-1.601 2.531-.088 3.256-3.637 5.876-7.997 5.876-4.361 0-7.905-2.617-7.997-5.876-.946-.45-1.601-1.523-1.601-2.531 0-1.548 1.255-2.802 2.802-2.802.643 0 1.234.217 1.707.58 1.286-.796 2.91-1.296 4.686-1.363v-.007c0-1.548 1.15-2.828 2.641-2.985v-.002c.208-.882 1.001-1.539 1.947-1.539z"/></svg>' },
        "More":      { bg: "#1e3157", svg: '<span style="color:#62adff;font-size:24px;font-weight:800;letter-spacing:2px;">•••</span>' }
    };

    const params = new URLSearchParams(window.location.search);
    const platform = params.get("platform") || "Facebook";
    const container = document.getElementById("orderContainer");

    // Redirect if not signed in
    watchAuthState((user) => {
        if (!user) window.location.href = "login.html";
    });

    async function loadServices() {
        try {
            const q = query(
                collection(db, "services"),
                where("category", "==", platform),
                where("status", "==", "active")
            );
            const snap = await getDocs(q);

            if (snap.empty) {
                container.innerHTML = `
                    <div class="form-card" style="text-align:center;padding:60px 30px;">
                        <div style="font-size:48px;margin-bottom:15px;">📭</div>
                        <h2 style="margin-bottom:10px;">No services yet</h2>
                        <p style="color:#8999b8;font-size:14px;">
                            Services for <b>${platform}</b> haven't been added yet.<br>
                            Please check back later.
                        </p>
                        <a href="dashboard.html" class="back-btn" style="display:inline-block;margin-top:20px;padding:12px 22px;">← Back to Dashboard</a>
                    </div>`;
                return;
            }

            const services = [];
            snap.forEach(d => services.push({ id: d.id, ...d.data() }));

            renderForm(services);
        } catch (err) {
            container.innerHTML = `
                <div class="form-card" style="text-align:center;padding:60px 30px;">
                    <div style="font-size:48px;margin-bottom:15px;">⚠️</div>
                    <h2 style="margin-bottom:10px;">Could not load services</h2>
                    <p style="color:#8999b8;font-size:13px;">${err.message}</p>
                </div>`;
        }
    }

    function renderForm(services) {
        const icon = platformIcons[platform] || platformIcons["More"];

        container.innerHTML = `
            <div class="platform-header">
                <div class="icon-box" style="background:${icon.bg};">${icon.svg}</div>
                <div>
                    <h1>${platform} Boost</h1>
                    <p>Choose a service and place your order</p>
                </div>
            </div>

            <div class="form-card">
                <form id="orderForm">

                    <div class="form-group">
                        <label for="service">Service:</label>
                        <select id="service" class="form-select" required>
                            <option value="" disabled selected>Select a service</option>
                            ${services.map((s, i) =>
                                `<option value="${s.id}" data-index="${i}">${s.serviceName}</option>`
                            ).join("")}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" class="form-select" disabled required>
                            <option value="" disabled selected>Select a type</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="link" id="linkLabel">Account Link:</label>
                        <input type="url" id="link" class="form-input" placeholder="https://..." required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" class="form-input" placeholder="Enter quantity" min="1" required>
                        <div class="hint" id="quantityHint">(Min: 0 - Max: 0)</div>
                    </div>

                    <div class="form-group">
                        <label>Price:</label>
                        <div class="price-row">
                            <span class="price-badge" id="totalPrice">0 NGN</span>
                            <span class="price-rate" id="priceRate">— NGN / 1k</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Average completion time:</label>
                        <div class="readonly-box" id="completionTime">—</div>
                    </div>

                    <div class="form-group">
                        <label>Note:</label>
                        <div class="note-box" id="noteBox">
                            <p style="color:#8999b8;">Select a service to see the notes.</p>
                        </div>
                    </div>

                    <button type="submit" class="purchase-btn" id="purchaseBtn" disabled>
                        PURCHASE
                    </button>

                    <div class="message" id="message"></div>
                </form>
            </div>
        `;

        const serviceSelect = document.getElementById("service");
        const typeSelect = document.getElementById("type");
        const linkInput = document.getElementById("link");
        const linkLabel = document.getElementById("linkLabel");
        const qtyInput = document.getElementById("quantity");
        const qtyHint = document.getElementById("quantityHint");
        const totalPrice = document.getElementById("totalPrice");
        const priceRate = document.getElementById("priceRate");
        const completionTime = document.getElementById("completionTime");
        const noteBox = document.getElementById("noteBox");
        const purchaseBtn = document.getElementById("purchaseBtn");
        const message = document.getElementById("message");

        let selectedService = null;

        function showMessage(t, type) {
            message.textContent = t;
            message.className = "message show " + type;
        }

        serviceSelect.addEventListener("change", () => {
            const idx = serviceSelect.selectedOptions[0].dataset.index;
            selectedService = services[idx];

            const types = selectedService.types || [];
            typeSelect.innerHTML = '<option value="" disabled selected>Select a type</option>' +
                types.map((t, i) =>
                    `<option value="${i}" data-price="${t.pricePer1k}" data-time="${t.time}">${t.name} — ${t.pricePer1k.toLocaleString()} NGN / 1k</option>`
                ).join("");
            typeSelect.disabled = false;

            linkLabel.textContent = (selectedService.linkLabel || "Account Link") + ":";
            linkInput.placeholder = `Enter ${selectedService.linkLabel || "link"}`;

            qtyInput.min = selectedService.minQuantity || 1;
            qtyInput.max = selectedService.maxQuantity || 1000000;
            qtyHint.textContent = `(Min: ${selectedService.minQuantity.toLocaleString()} - Max: ${selectedService.maxQuantity.toLocaleString()})`;

            completionTime.textContent = selectedService.deliveryTime || "—";

            if (selectedService.note) {
                noteBox.innerHTML = `<ol>${selectedService.note}</ol>`;
            } else {
                noteBox.innerHTML = `<p style="color:#8999b8;">No additional notes.</p>`;
            }

            qtyInput.value = "";
            totalPrice.textContent = "0 NGN";
            priceRate.textContent = `— NGN / 1k`;
            purchaseBtn.disabled = true;
        });

        typeSelect.addEventListener("change", () => {
            const opt = typeSelect.selectedOptions[0];
            const price = parseFloat(opt.dataset.price);
            const time = opt.dataset.time;
            priceRate.textContent = `${price.toLocaleString()} NGN / 1k`;
            completionTime.textContent = time || "—";
            selectedService._currentPrice = price;
            updatePrice();
        });

        qtyInput.addEventListener("input", updatePrice);

        function updatePrice() {
            if (!selectedService || !selectedService._currentPrice) return;
            const qty = parseFloat(qtyInput.value) || 0;
            const min = selectedService.minQuantity || 0;
            const max = selectedService.maxQuantity || 1000000;

            if (qty < min || qty > max) {
                totalPrice.textContent = "0 NGN";
                purchaseBtn.disabled = true;
                return;
            }

            const total = (qty / 1000) * selectedService._currentPrice;
            totalPrice.textContent = total.toLocaleString(undefined, { maximumFractionDigits: 0 }) + " NGN";
            purchaseBtn.disabled = false;
        }

        document.getElementById("orderForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!selectedService || !selectedService._currentPrice) {
                return showMessage("Please select a service and type.", "error");
            }

            const qty = parseFloat(qtyInput.value);
            const link = linkInput.value.trim();
            const typeName = typeSelect.selectedOptions[0].text.split(" — ")[0];

            if (!link) return showMessage("Please enter your link.", "error");
            if (qty < selectedService.minQuantity || qty > selectedService.maxQuantity) {
                return showMessage("Quantity out of range.", "error");
            }

            purchaseBtn.disabled = true;
            showMessage("⏳ Processing your order...", "success");

            try {
                const user = auth.currentUser;
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const userData = userSnap.data();
                const balance = userData.balance || 0;
                const total = (qty / 1000) * selectedService._currentPrice;

                if (balance < total) {
                    purchaseBtn.disabled = false;
                    return showMessage("❌ Insufficient balance. Please add funds.", "error");
                }

                // Deduct balance
                await updateDoc(userRef, {
                    balance: increment(-total),
                    totalOrders: increment(1)
                });

                // Save order
                await addDoc(collection(db, "orders"), {
                    userId: user.uid,
                    userEmail: user.email,
                    platform: platform,
                    serviceId: selectedService.id,
                    serviceName: selectedService.serviceName,
                    type: typeName,
                    link: link,
                    quantity: qty,
                    pricePer1k: selectedService._currentPrice,
                    totalPrice: total,
                    status: "pending",
                    createdAt: serverTimestamp()
                });

                showMessage("✅ Order placed successfully!", "success");
                setTimeout(() => window.location.href = "orders.html", 1200);
            } catch (err) {
                purchaseBtn.disabled = false;
                showMessage("❌ " + err.message, "error");
            }
        });
    }

    loadServices();
</script>

</body>
</html>

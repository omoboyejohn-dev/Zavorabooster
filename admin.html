<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #fff;
            line-height: 1.6; min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #192849;
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 76px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            font-size: 21px;
        }
        .logo span { color: #4da3ff; }
        .admin-badge {
            padding: 6px 12px; border-radius: 20px;
            background: rgba(255, 85, 119, 0.15);
            border: 1px solid rgba(255, 85, 119, 0.4);
            color: #ff8899; font-size: 11px; font-weight: 800;
        }

        .page { width: min(900px, 94%); margin: 40px auto 80px; }

        .page h1 { font-size: 30px; margin-bottom: 8px; }
        .page > p { color: #8999b8; font-size: 14px; margin-bottom: 30px; }

        .tabs {
            display: flex; gap: 8px; margin-bottom: 25px;
            border-bottom: 1px solid #192849; padding-bottom: 0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 18px; cursor: pointer;
            color: #8999b8; font-size: 13px; font-weight: 700;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            background: transparent; border: none;
            font-family: inherit;
        }
        .tab.active { color: #62adff; border-bottom-color: #62adff; }
        .tab:hover { color: #ffffff; }

        .form-card {
            padding: 32px; border-radius: 20px;
            background: #0b1230; border: 1px solid #192849;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 12px;
            font-weight: 700; color: #aeb9d4;
            margin-bottom: 8px; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 13px 15px;
            border-radius: 10px; border: 1px solid #1e3157;
            background: #0a1230; color: #ffffff;
            font-size: 14px; outline: none;
            font-family: inherit;
            transition: 0.25s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-select option { background: #0a1230; }
        .form-textarea { min-height: 100px; resize: vertical; }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .types-block {
            padding: 18px;
            border-radius: 12px;
            background: #0a1230;
            border: 1px solid #1e3157;
            margin-bottom: 15px;
        }
        .types-block h4 {
            font-size: 13px; margin-bottom: 12px;
            color: #aeb9d4;
            display: flex; justify-content: space-between; align-items: center;
        }
        .type-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .remove-type {
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255, 85, 119, 0.1);
            border: 1px solid rgba(255, 85, 119, 0.3);
            color: #ff8899;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }

        .add-type-btn {
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(77, 163, 255, 0.1);
            border: 1px solid rgba(77, 163, 255, 0.3);
            color: #62adff;
            font-size: 12px; font-weight: 700;
            cursor: pointer;
        }

        .save-btn {
            width: 100%; padding: 15px;
            border-radius: 12px; border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; font-size: 15px; font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(40, 104, 255, 0.3);
        }
        .save-btn:hover { transform: translateY(-2px); }

        .msg {
            display: none; margin-top: 16px;
            padding: 12px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; text-align: center;
        }
        .msg.show { display: block; }
        .msg.error { background: rgba(255, 85, 119, 0.1); border: 1px solid rgba(255, 85, 119, 0.3); color: #ff8899; }
        .msg.success { background: rgba(101, 230, 160, 0.1); border: 1px solid rgba(101, 230, 160, 0.3); color: #65e6a0; }

        .service-item {
            padding: 15px;
            border-radius: 12px;
            background: #0a1230;
            border: 1px solid #1e3157;
            margin-bottom: 10px;
            display: flex; justify-content: space-between;
            align-items: center; gap: 15px;
        }
        .service-item .info h5 { font-size: 14px; margin-bottom: 3px; }
        .service-item .info p { font-size: 12px; color: #8999b8; }
        .service-item .actions { display: flex; gap: 8px; }
        .service-item button {
            padding: 8px 14px; border-radius: 8px;
            border: none; font-size: 12px; font-weight: 700;
            cursor: pointer;
        }
        .edit-btn {
            background: rgba(77, 163, 255, 0.1);
            color: #62adff;
            border: 1px solid rgba(77, 163, 255, 0.3);
        }
        .delete-btn {
            background: rgba(255, 85, 119, 0.1);
            color: #ff8899;
            border: 1px solid rgba(255, 85, 119, 0.3);
        }

        @media (max-width: 700px) {
            .row-2, .row-3 { grid-template-columns: 1fr; }
            .type-row { grid-template-columns: 1fr; }
            .page { width: 92%; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <span class="admin-badge">👑 ADMIN</span>
    </div>
</header>

<main class="page">
    <h1>Admin Panel</h1>
    <p>Add, edit and manage services for each platform.</p>

    <div class="form-card">
        <h3 style="margin-bottom:20px;font-size:16px;">➕ Add New Service</h3>
        <form id="serviceForm">

            <div class="form-group">
                <label>Category (Platform)</label>
                <select id="category" class="form-select" required>
                    <option value="" disabled selected>Select platform</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Instagram">Instagram</option>
                    <option value="TikTok">TikTok</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Twitter">Twitter (X)</option>
                    <option value="More">More / Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Service Name</label>
                <input type="text" id="serviceName" class="form-input" placeholder="e.g. Followers, Video Likes" required>
            </div>

            <div class="form-group">
                <label>Types (Quality levels)</label>
                <div class="types-block" id="typesBlock">
                    <h4>Type options <button type="button" class="add-type-btn" id="addTypeBtn">+ Add Type</button></h4>
                    <div id="typesList"></div>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Min Quantity</label>
                    <input type="number" id="minQty" class="form-input" placeholder="50" required>
                </div>
                <div class="form-group">
                    <label>Max Quantity</label>
                    <input type="number" id="maxQty" class="form-input" placeholder="50000" required>
                </div>
            </div>

            <div class="form-group">
                <label>Link Label</label>
                <input type="text" id="linkLabel" class="form-input" placeholder="e.g. TikTok account link" required>
            </div>

            <div class="form-group">
                <label>Notes (one per line, will become a numbered list)</label>
                <textarea id="note" class="form-textarea" placeholder="Make sure account is not private&#10;No drop in followers"></textarea>
            </div>

            <button type="submit" class="save-btn" id="saveBtn">Save Service</button>
            <div class="msg" id="msg"></div>
        </form>
    </div>

    <div class="form-card">
        <h3 style="margin-bottom:20px;font-size:16px;">📋 Existing Services</h3>
        <div id="serviceList">
            <p style="color:#8999b8;font-size:13px;">Loading...</p>
        </div>
    </div>
</main>

<script type="module">
    import { db, auth, watchAuthState, getUserProfile } from "./firebase-config.js";
    import {
        collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const typesList = document.getElementById("typesList");
    const addTypeBtn = document.getElementById("addTypeBtn");
    const serviceForm = document.getElementById("serviceForm");
    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");
    const serviceList = document.getElementById("serviceList");

    // Check admin
    watchAuthState(async (user) => {
        if (!user) return window.location.href = "login.html";
        const profile = await getUserProfile(user.uid);
        if (!profile.success || profile.data.role !== "admin") {
            alert("Admin access only");
            window.location.href = "dashboard.html";
        }
    });

    // Add a type row
    function addTypeRow(name = "", price = "", time = "") {
        const row = document.createElement("div");
        row.className = "type-row";
        row.innerHTML = `
            <input type="text" class="form-input type-name" placeholder="Type name (e.g. Average Quality)" value="${name}">
            <input type="number" class="form-input type-price" placeholder="Price / 1k" value="${price}">
            <input type="text" class="form-input type-time" placeholder="Time (e.g. 4 Hours)" value="${time}">
            <button type="button" class="remove-type">✕</button>
        `;
        row.querySelector(".remove-type").addEventListener("click", () => row.remove());
        typesList.appendChild(row);
    }

    // Start with one type row
    addTypeRow();

    addTypeBtn.addEventListener("click", () => addTypeRow());

    function showMsg(t, type) {
        msg.textContent = t;
        msg.className = "msg show " + type;
    }

    // Save service
    serviceForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const category = document.getElementById("category").value;
        const serviceName = document.getElementById("serviceName").value.trim();
        const minQuantity = parseInt(document.getElementById("minQty").value);
        const maxQuantity = parseInt(document.getElementById("maxQty").value);
        const linkLabel = document.getElementById("linkLabel").value.trim();
        const note = document.getElementById("note").value.trim();

        // Collect types
        const types = [];
        document.querySelectorAll(".type-row").forEach(row => {
            const n = row.querySelector(".type-name").value.trim();
            const p = parseFloat(row.querySelector(".type-price").value);
            const t = row.querySelector(".type-time").value.trim();
            if (n && !isNaN(p)) types.push({ name: n, pricePer1k: p, time: t || "1 Hour" });
        });

        if (!category || !serviceName || !types.length) {
            return showMsg("Please fill all fields and add at least one type.", "error");
        }

        // Default price = first type's price
        const pricePer1k = types[0].pricePer1k;
        const deliveryTime = types[0].time;

        // Notes as <li> list
        const noteHtml = note
            ? note.split("\n").filter(l => l.trim()).map(l => `<li>${l}</li>`).join("")
            : "";

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";

        try {
            await addDoc(collection(db, "services"), {
                category,
                serviceName,
                types,
                pricePer1k,
                deliveryTime,
                minQuantity,
                maxQuantity,
                linkLabel,
                note: noteHtml,
                status: "active",
                createdAt: serverTimestamp()
            });

            showMsg("✅ Service saved successfully!", "success");
            serviceForm.reset();
            typesList.innerHTML = "";
            addTypeRow();
            loadServices();
        } catch (err) {
            showMsg("❌ " + err.message, "error");
        }

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Service";
    });

    // Load existing services
    async function loadServices() {
        try {
            const snap = await getDocs(collection(db, "services"));
            if (snap.empty) {
                serviceList.innerHTML = '<p style="color:#8999b8;font-size:13px;">No services yet.</p>';
                return;
            }

            let html = "";
            snap.forEach(d => {
                const s = d.data();
                html += `
                    <div class="service-item">
                        <div class="info">
                            <h5>${s.category} — ${s.serviceName}</h5>
                            <p>${s.types.length} type(s) · from ${s.pricePer1k.toLocaleString()} NGN / 1k · ${s.minQuantity}–${s.maxQuantity}</p>
                        </div>
                        <div class="actions">
                            <button class="delete-btn" data-id="${d.id}">Delete</button>
                        </div>
                    </div>`;
            });
            serviceList.innerHTML = html;

            // Delete handlers
            serviceList.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    if (!confirm("Delete this service?")) return;
                    await deleteDoc(doc(db, "services", btn.dataset.id));
                    loadServices();
                });
            });
        } catch (err) {
            serviceList.innerHTML = `<p style="color:#ff8899;">Error: ${err.message}</p>`;
        }
    }

    loadServices();
</script>

</body>
</html>

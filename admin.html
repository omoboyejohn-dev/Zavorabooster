<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Zavora Booster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050817; color: #fff;
            line-height: 1.6; min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 8, 23, 0.94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #192849;
        }
        .nav-container {
            width: min(1180px, 94%); margin: auto; height: 68px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
        .logo-icon {
            width: 36px; height: 36px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #4da3ff, #7657ff);
            font-size: 18px;
        }
        .logo span { color: #4da3ff; }
        .admin-badge {
            padding: 6px 12px; border-radius: 20px;
            background: rgba(255, 85, 119, 0.15);
            border: 1px solid rgba(255, 85, 119, 0.4);
            color: #ff8899; font-size: 11px; font-weight: 800;
        }

        .page { width: min(700px, 94%); margin: 30px auto 80px; }
        .page h1 { font-size: 24px; margin-bottom: 6px; }
        .page > p { color: #8999b8; font-size: 13px; margin-bottom: 25px; }

        .tabs {
            display: flex; gap: 6px; margin-bottom: 22px;
            overflow-x: auto; padding-bottom: 4px;
        }
        .tab {
            padding: 9px 14px; border-radius: 20px;
            background: #0a1230; border: 1px solid #1e3157;
            color: #8999b8; font-size: 11px; font-weight: 700;
            white-space: nowrap; transition: 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; border-color: transparent;
        }
        .section { display: none; }
        .section.active { display: block; }

        .card {
            padding: 22px; border-radius: 16px;
            background: #0b1230; border: 1px solid #192849;
            margin-bottom: 18px;
        }
        .card h3 {
            font-size: 15px; margin-bottom: 16px;
            font-weight: 800;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 11px;
            font-weight: 700; color: #aeb9d4;
            margin-bottom: 6px; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 11px 13px;
            border-radius: 10px; border: 1px solid #1e3157;
            background: #0a1230; color: #ffffff;
            font-size: 13px; outline: none;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 3px rgba(77, 163, 255, 0.12);
        }
        .form-select option { background: #0a1230; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .save-btn {
            width: 100%; padding: 13px;
            border-radius: 10px; border: none;
            background: linear-gradient(135deg, #2868ff, #7657ff);
            color: white; font-size: 13px; font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(40, 104, 255, 0.3);
            margin-top: 8px;
        }
        .save-btn:hover { transform: translateY(-2px); }
        .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .msg {
            display: none; margin-top: 12px;
            padding: 10px; border-radius: 8px;
            font-size: 12px; font-weight: 600; text-align: center;
        }
        .msg.show { display: block; }
        .msg.error { background: rgba(255, 85, 119, 0.1); border: 1px solid rgba(255, 85, 119, 0.3); color: #ff8899; }
        .msg.success { background: rgba(101, 230, 160, 0.1); border: 1px solid rgba(101, 230, 160, 0.3); color: #65e6a0; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th {
            text-align: left; padding: 10px;
            background: #070c21; color: #8999b8; font-weight: 700;
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.5px; border-bottom: 1px solid #1e3157;
        }
        .data-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #14204a;
            color: #dce6fb; vertical-align: middle;
        }
        .data-table tr:hover td { background: rgba(77, 163, 255, 0.04); }

        .badge {
            display: inline-block; padding: 3px 9px;
            border-radius: 20px; font-size: 10px; font-weight: 700;
        }
        .badge-pending { background: rgba(255, 200, 85, 0.15); color: #ffc855; border: 1px solid rgba(255, 200, 85, 0.3); }
        .badge-processing { background: rgba(77, 163, 255, 0.15); color: #62adff; border: 1px solid rgba(77, 163, 255, 0.3); }
        .badge-completed { background: rgba(101, 230, 160, 0.15); color: #65e6a0; border: 1px solid rgba(101, 230, 160, 0.3); }
        .badge-cancelled { background: rgba(255, 85, 119, 0.15); color: #ff8899; border: 1px solid rgba(255, 85, 119, 0.3); }
        .badge-admin { background: rgba(177, 140, 255, 0.15); color: #b18cff; border: 1px solid rgba(177, 140, 255, 0.3); }
        .badge-user { background: rgba(137, 153, 184, 0.15); color: #8999b8; border: 1px solid rgba(137, 153, 184, 0.3); }

        .action-btn {
            padding: 5px 10px; border-radius: 6px;
            font-size: 10px; font-weight: 700;
            border: none; cursor: pointer; margin-right: 4px;
            margin-bottom: 4px;
        }
        .btn-delete { background: rgba(255, 85, 119, 0.15); color: #ff8899; border: 1px solid rgba(255, 85, 119, 0.3); }
        .btn-proc { background: rgba(77, 163, 255, 0.15); color: #62adff; border: 1px solid rgba(77, 163, 255, 0.3); }
        .btn-done { background: rgba(101, 230, 160, 0.15); color: #65e6a0; border: 1px solid rgba(101, 230, 160, 0.3); }
        .btn-cancel { background: rgba(255, 85, 119, 0.15); color: #ff8899; border: 1px solid rgba(255, 85, 119, 0.3); }

        .empty-row { padding: 30px; text-align: center; color: #7183a7; font-size: 12px; }

        .table-wrap { overflow-x: auto; }
        @media (max-width: 700px) {
            .row-2 { grid-template-columns: 1fr; }
            .data-table { min-width: 560px; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="dashboard.html" class="logo">
            <div class="logo-icon">🚀</div>
            <div>Zavora <span>Booster</span></div>
        </a>
        <span class="admin-badge">👑 ADMIN</span>
    </div>
</header>

<main class="page">
    <h1>Admin Panel</h1>
    <p>Add services and manage customer orders.</p>

    <div class="tabs">
        <button class="tab active" data-tab="services">🎯 Add Service</button>
        <button class="tab" data-tab="orders">📦 Orders</button>
    </div>

    <!-- ================= ADD SERVICE ================= -->
    <section class="section active" id="section-services">
        <div class="card">
            <h3>➕ Add New Service</h3>
            <form id="serviceForm">

                <div class="form-group">
                    <label>Category / Platform</label>
                    <select id="category" class="form-select" required>
                        <option value="" disabled selected>Select platform</option>
                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>TikTok</option>
                        <option>YouTube</option>
                        <option>Twitter</option>
                        <option>WhatsApp</option>
                        <option>Telegram</option>
                        <option>Snapchat</option>
                        <option>LinkedIn</option>
                        <option>Spotify</option>
                        <option>Reddit</option>
                        <option>More</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Service</label>
                    <select id="serviceName" class="form-select" required>
                        <option value="" disabled selected>Select service</option>
                        <option>Followers</option>
                        <option>Likes</option>
                        <option>Views</option>
                        <option>Comments</option>
                        <option>Shares</option>
                        <option>Subscribers</option>
                        <option>Members</option>
                        <option>Watch Time</option>
                        <option>Live Stream Views</option>
                        <option>Story Views</option>
                        <option>Saves</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Type / Quality</label>
                    <input type="text" id="type" class="form-input" placeholder="e.g. Average Quality Followers" required>
                </div>

                <div class="form-group">
                    <label>Price per 1k (NGN)</label>
                    <input type="number" id="pricePer1k" class="form-input" placeholder="e.g. 4900" required>
                </div>

                <div class="row-2">
                    <div class="form-group">
                        <label>Min Quantity</label>
                        <input type="number" id="minQty" class="form-input" placeholder="50" required>
                    </div>
                    <div class="form-group">
                        <label>Max Quantity</label>
                        <input type="number" id="maxQty" class="form-input" placeholder="50000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Completion Time</label>
                    <input type="text" id="deliveryTime" class="form-input" placeholder="e.g. 4 Hours" required>
                </div>

                <div class="form-group">
                    <label>Link Label</label>
                    <input type="text" id="linkLabel" class="form-input" placeholder="e.g. Facebook Page Link" required>
                </div>

                <div class="form-group">
                    <label>Notes (one per line)</label>
                    <textarea id="note" class="form-textarea" placeholder="Make sure account is not private&#10;No drop in followers&#10;Guarantee: 30 days"></textarea>
                </div>

                <button type="submit" class="save-btn" id="saveBtn">Save Service</button>
                <div class="msg" id="msg"></div>
            </form>
        </div>

        <div class="card">
            <h3>📋 Existing Services</h3>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Platform</th>
                            <th>Service</th>
                            <th>Type</th>
                            <th>Price / 1k</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="serviceList">
                        <tr><td colspan="5" class="empty-row">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- ================= ORDERS ================= -->
    <section class="section" id="section-orders">
        <div class="card">
            <h3>📦 Customer Orders</h3>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Platform</th>
                            <th>Service</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr><td colspan="7" class="empty-row">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script type="module">
    import { db, watchAuthState, getUserProfile } from "./firebase-config.js";
    import {
        collection, addDoc, getDocs, deleteDoc, doc,
        updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Admin guard
    watchAuthState(async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        const profile = await getUserProfile(user.uid);
        if (!profile.success || profile.data.role !== "admin") {
            alert("Admin access only");
            window.location.href = "dashboard.html";
            return;
        }
        loadServices();
        loadOrders();
    });

    // Tab switching
    document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById("section-" + tab.dataset.tab).classList.add("active");
        });
    });

    // ============================
    // ADD SERVICE
    // ============================
    const serviceForm = document.getElementById("serviceForm");
    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");
    const serviceList = document.getElementById("serviceList");
    const ordersTable = document.getElementById("ordersTable");

    function showMsg(t, type) {
        msg.textContent = t;
        msg.className = "msg show " + type;
        setTimeout(() => msg.className = "msg", 4000);
    }

    serviceForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const category = document.getElementById("category").value;
        const serviceName = document.getElementById("serviceName").value;
        const typeName = document.getElementById("type").value.trim();
        const pricePer1k = parseFloat(document.getElementById("pricePer1k").value);
        const minQuantity = parseInt(document.getElementById("minQty").value);
        const maxQuantity = parseInt(document.getElementById("maxQty").value);
        const deliveryTime = document.getElementById("deliveryTime").value.trim();
        const linkLabel = document.getElementById("linkLabel").value.trim();
        const note = document.getElementById("note").value.trim();

        if (!category || !serviceName || !typeName || !pricePer1k) {
            return showMsg("Please fill all required fields.", "error");
        }

        // Convert notes into <li> list
        const noteHtml = note
            ? note.split("\n").filter(l => l.trim()).map(l => `<li>${l}</li>`).join("")
            : "";

        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";

        try {
            await addDoc(collection(db, "services"), {
                category,
                serviceName,
                types: [{ name: typeName, pricePer1k, time: deliveryTime }],
                pricePer1k,
                deliveryTime,
                minQuantity,
                maxQuantity,
                linkLabel,
                note: noteHtml,
                status: "active",
                createdAt: serverTimestamp()
            });

            showMsg("✅ Service saved successfully!", "success");
            serviceForm.reset();
            loadServices();
        } catch (err) {
            showMsg("❌ " + err.message, "error");
        }

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Service";
    });

    async function loadServices() {
        try {
            const snap = await getDocs(collection(db, "services"));
            if (snap.empty) {
                serviceList.innerHTML = '<tr><td colspan="5" class="empty-row">No services yet.</td></tr>';
                return;
            }
            let html = "";
            snap.forEach(d => {
                const s = d.data();
                html += `
                    <tr>
                        <td>${s.category}</td>
                        <td>${s.serviceName}</td>
                        <td>${s.types[0]?.name || "—"}</td>
                        <td style="color:#62adff;font-weight:700;">${s.pricePer1k.toLocaleString()} NGN</td>
                        <td><button class="action-btn btn-delete" data-del="${d.id}">Delete</button></td>
                    </tr>`;
            });
            serviceList.innerHTML = html;

            serviceList.querySelectorAll("[data-del]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    if (!confirm("Delete this service?")) return;
                    await deleteDoc(doc(db, "services", btn.dataset.del));
                    loadServices();
                });
            });
        } catch (err) {
            serviceList.innerHTML = `<tr><td colspan="5" class="empty-row" style="color:#ff8899;">Error: ${err.message}</td></tr>`;
        }
    }

    // ============================
    // ORDERS
    // ============================
    async function loadOrders() {
        try {
            const snap = await getDocs(collection(db, "orders"));
            if (snap.empty) {
                ordersTable.innerHTML = '<tr><td colspan="7" class="empty-row">No orders yet.</td></tr>';
                return;
            }
            let html = "";
            snap.forEach(d => {
                const o = d.data();
                const statusClass = "badge-" + (o.status || "pending");
                html += `
                    <tr>
                        <td>${o.userEmail || "—"}</td>
                        <td>${o.platform || "—"}</td>
                        <td>${o.serviceName || "—"}<br><span style="font-size:10px;color:#8999b8;">${o.type || ""}</span></td>
                        <td>${(o.quantity || 0).toLocaleString()}</td>
                        <td style="color:#65e6a0;font-weight:700;">${(o.totalPrice || 0).toLocaleString()} NGN</td>
                        <td><span class="badge ${statusClass}">${o.status || "pending"}</span></td>
                        <td>
                            <button class="action-btn btn-proc" data-id="${d.id}" data-status="processing">⏳ Proc</button>
                            <button class="action-btn btn-done" data-id="${d.id}" data-status="completed">✅ Done</button>
                            <button class="action-btn btn-cancel" data-id="${d.id}" data-status="cancelled">❌ Cancel</button>
                        </td>
                    </tr>`;
            });
            ordersTable.innerHTML = html;

            ordersTable.querySelectorAll("[data-status]").forEach(btn => {
                btn.addEventListener("click", async () => {
                    await updateDoc(doc(db, "orders", btn.dataset.id), { status: btn.dataset.status });
                    loadOrders();
                });
            });
        } catch (err) {
            ordersTable.innerHTML = `<tr><td colspan="7" class="empty-row" style="color:#ff8899;">Error: ${err.message}</td></tr>`;
        }
    }
</script>

</body>
</html>
